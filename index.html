<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI每日股市资讯</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">AI每日股市资讯</h1>
            <p class="text-gray-600">专注挖掘上升周期、业绩高增长的优质公司</p>
            <p id="update-time" class="text-sm text-gray-500 mt-2"></p>
        </header>
        
        <main id="content" class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="animate-pulse">
                <div class="h-6 bg-gray-200 rounded w-3/4 mb-4"></div>
                <div class="h-4 bg-gray-200 rounded w-full mb-2"></div>
                <div class="h-4 bg-gray-200 rounded w-full mb-2"></div>
                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
            </div>
        </main>
        
        <footer class="text-center text-gray-500 text-sm">
            <p>数据更新时间：每日早8:00 | AI生成内容仅供参考，不构成投资建议</p>
        </footer>
    </div>

    <script>
        fetch('news.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('update-time').textContent = `最后更新：${data.update_time}`;
                document.getElementById('content').innerHTML = data.content;
            })
            .catch(error => {
                document.getElementById('content').innerHTML = '<p class="text-red-500">加载资讯失败，请稍后刷新</p>';
            });
    </script>
</body>
</html>
